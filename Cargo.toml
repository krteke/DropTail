[package]
name = "droptail"
version = "0.1.0"
edition = "2024"

[dependencies]
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

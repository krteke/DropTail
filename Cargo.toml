[package]
name = "droptail"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
os_pipe = "1.2.3"
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"
walkdir = "2.5.0"
zip = { version = "9.2.2", default-features = false, features = [
    "deflate-flate2",
] }
zstd = "0.14.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
